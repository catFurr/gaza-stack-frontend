name: Provision Server
on:
  workflow_dispatch:
    inputs:
      domain:
        required: true
        type: string
        default: buytelegram.store

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: catFurr/kon
          ref: main

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Install Ansible
        run: pip install ansible

      - name: Write inventory
        run: |
          cat > ansible/inventory/hosts.yml << EOF
          all:
            hosts:
              vps:
                ansible_host: ${{ secrets.VPS_HOST }}
                ansible_user: root
                ansible_ssh_private_key_file: ~/.ssh/deploy_key
          EOF

      - name: Provision
        working-directory: ansible
        run: |
          ansible-playbook playbooks/provision.yml \
            -e "domain=${{ inputs.domain }}" \
            -e "cloudflare_api_token=${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -e '{"repos": [{"name":"gaza-stack-frontend","url":"https://github.com/catFurr/gaza-stack-frontend"}]}' \
            -e "github_token=${{ secrets.KON_GITHUB_TOKEN }}" \
            -e "github_user=${{ github.actor }}"
        env:
          ANSIBLE_HOST_KEY_CHECKING: "false"